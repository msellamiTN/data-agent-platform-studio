name: CI

on:
  push:
    branches: ["main", "feature/colab-crewai-dual-agent-studio"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install --upgrade pandas pytest
      - name: Compile Python sources
        run: python -m compileall -q app.py studio tests
      - name: Run deterministic tool tests
        run: PYTHONPATH=. python -m pytest -q tests/test_sql_guard.py tests/test_etl.py tests/test_llm_runtime.py tests/test_scenarios.py
